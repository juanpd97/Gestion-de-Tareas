<section class="section-card">
    <h2 class="section-title">Lista de tareas</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descripción</th>
                    <th>Inicio</th>
                    <th>Vencimiento</th>
                    <th>Estado</th>
                    <th>Opciones</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="tarea : ${listaTareas}">
                <td th:text="${tarea.id}"></td>
                <td class="fw-semibold" th:text="${tarea.titulo}"></td>
                <td th:text="${tarea.descripcion}"></td>
                <td th:text="${tarea.fechaCreacion}"></td>
                <td th:text="${tarea.fechaVencimiento}"></td>
                <td>
                    <span class="badge badge-estado"
                          th:classappend="${tarea.estado == 'Completada'} ? ' text-bg-success' : (${tarea.estado == 'En progreso'} ? ' text-bg-warning' : ' text-bg-secondary')"
                          th:text="${tarea.estado}">
                    </span>
                </td>
                <td>
                    <div class="actions">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{'/tarea/editar/' + ${tarea.id}}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{'/tarea/eliminar/' + ${tarea.id}}">Eliminar</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaTareas)}">
                <td colspan="7" class="text-center text-muted py-4">No hay tareas creadas todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
