<!doctype html>
<html lang="en">
<head th:insert="./layout/head"></head>
<body>
    <header th:insert="./layout/header"></header>

    <main class="page-container">
        <form th:action="@{/tarea/editar}" th:object="${tarea}" method="post" class="section-card">
            <h2 class="section-title">Editar tarea</h2>
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
        <form th:action="@{/tarea/editar}" th:object="${tarea}" method="post" class="section-card">
            <h2 class="section-title">Editar tarea</h2>
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" th:field="*{titulo}" th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado" th:field="*{estado}">
                        <option value="Por hacer">Por hacer</option>
                        <option value="En progreso">En progreso</option>
                        <option value="Completada">Completada</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                    <input type="date" class="form-control" id="fechaInicio" th:field="*{fechaCreacion}" th:classappend="${#fields.hasErrors('fechaCreacion')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaCreacion')}" th:errors="*{fechaCreacion}"></div>
                </div>

                <div class="col-md-4">
                    <label for="fechaVencimiento" class="form-label">Fecha de vencimiento</label>
                    <input type="date" class="form-control" id="fechaVencimiento" th:field="*{fechaVencimiento}" th:classappend="${#fields.hasErrors('fechaVencimientoPosterior')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaVencimientoPosterior')}" th:errors="*{fechaVencimientoPosterior}"></div>
                </div>
            </div>

            <div class="mt-4 d-flex justify-content-between">
                <a href="/" class="btn btn-outline-secondary">Volver</a>
                <button type="submit" class="btn btn-primary px-4">Guardar cambios</button>
            </div>
        </form>

                <button type="submit" class="btn btn-primary px-4">Guardar cambios</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
