services:
  db:
    image: mysql:8.4
    container_name: gestiontareas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: GestionTareas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestiontareas-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: GestionTareas
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
